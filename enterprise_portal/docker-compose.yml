version: '3.8'

services:
  portal:
    build: .
    container_name: campushub_enterprise_portal
    ports:
      - "3000:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
