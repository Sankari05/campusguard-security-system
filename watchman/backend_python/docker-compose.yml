version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusguard_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: campusguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    container_name: campusguard_api
    environment:
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/campusguard_db
      APP_ENV: production
      APP_PORT: 8080
      APP_DEBUG: "false"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
