name: Watchman Gate Security CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend_python/**'
      - 'frontend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend_python/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: watchman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGE 1: Python Backend CI (Ruff Linting + Pytest + Database Integration)
  # =========================================================================
  backend-ci:
    name: 🐍 Backend Lint, Test & DB Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_python

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: campusguard_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend_python/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff

      - name: 🔍 Ruff Code Quality & Static Analysis
        run: python -m ruff check app/ tests/

      - name: 🧪 Run Pytest Integration Test Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/campusguard_db
          SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
          ENVIRONMENT: testing
        run: pytest -v tests/ --tb=short

  # =========================================================================
  # STAGE 2: Frontend CI (Vite Build + Playwright Automated E2E Testing)
  # =========================================================================
  frontend-ci:
    name: 🎭 Frontend Build & Playwright Automated E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Node Dependencies
        run: npm ci

      - name: 🏗️ Verify Production Bundle (Vite Build)
        run: npm run build

      - name: 🎭 Install Playwright Browsers with System Dependencies
        run: npx playwright install --with-deps chromium

      - name: 🚀 Execute Playwright E2E Automated Suites
        run: npm run test:e2e -- --project=chromium

      - name: 📊 Upload Playwright HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchman-playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # =========================================================================
  # STAGE 3: Multi-Service Docker Containerization & Security Audit
  # =========================================================================
  docker-build:
    name: 🐳 Docker Containerization Build & Audit
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_python
          file: ./backend_python/Dockerfile
          push: false
          tags: watchman-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # STAGE 4: Continuous Deployment (Staging Gate)
  # =========================================================================
  deploy-staging:
    name: 🚀 Continuous Deployment Gate (Staging)
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - name: 📢 Deployment Notification
        run: |
          echo "=========================================================="
          echo "🎉 ALL TESTS PASSED: MNC Quality Gates Cleared"
          echo "Deploying Watchman Security Suite to Staging Environment..."
          echo "Target Commit: ${{ github.sha }}"
          echo "=========================================================="
